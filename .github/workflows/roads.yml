name: roads
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: roads
jobs:
  roads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 roads/roads.py out
      - name: publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && git init -q -b data && git add -A
          git -c user.name=terra-live-bot -c user.email=bot@users.noreply.github.com commit -qm "roads $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" data
