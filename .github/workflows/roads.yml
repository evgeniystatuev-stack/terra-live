name: roads
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 */3 * * *"
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: roads
jobs:
  roads:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: python3 roads/roads.py out
      - name: publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && git init -q -b data && git add -A
          git -c user.name=terra-live-bot -c user.email=bot@users.noreply.github.com commit -qm "roads $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" data
  # GitHub switches off schedules after 60 days without commits on the repo: leave a weekly footprint on main
  keepalive:
    if: github.event.schedule == '0 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date -u +%FT%TZ > roads/.last-run && git add roads/.last-run
          git -c user.name=terra-live-bot -c user.email=bot@users.noreply.github.com commit -qm "roads keepalive"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
  # Our own copy of the live cloud map (Live Cloud Maps, CC0; "Contains modified EUMETSAT data"): the app falls back to it
  # if that one-person server is down. Refreshed every 3 hours, single-commit branch `clouds`.
  clouds:
    if: github.event.schedule == '7 */3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -fsSL -A "TerraLive/0.1 (cloud mirror; yauhenistatuyeu1996@yahoo.com)" -o clouds.jpg https://clouds.matteason.co.uk/images/4096x2048/clouds.jpg
          [ "$(stat -c %s clouds.jpg)" -gt 200000 ] || { echo "image too small — keeping the previous copy"; exit 0; }
          git init -q -b clouds && git add clouds.jpg
          git -c user.name=terra-live-bot -c user.email=bot@users.noreply.github.com commit -qm "clouds $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" clouds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
